<!DOCTYPE html>
<html>
<head>
    <title>MatchCV</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        .candidate { border:1px solid #ccc; padding:10px; margin:5px; }
    </style>
</head>
<body>
    <h1>Поиск кандидатов</h1>
    <label>Выберите вакансию:</label>
    <select id="vacancySelect"></select>
    <input type="number" id="topK" value="10" min="1" max="50">
    <button onclick="search()">Искать</button>
    <div id="results"></div>

    <script>
        async function loadVacancies() {
            const resp = await fetch('/vacancies');
            const data = await resp.json();
            const select = document.getElementById('vacancySelect');
            data.forEach(v => {
                const opt = document.createElement('option');
                opt.value = v.id;
                opt.text = v.title;
                select.appendChild(opt);
            });
        }

        async function search() {
            const vacId = document.getElementById('vacancySelect').value;
            const topK = document.getElementById('topK').value;
            const form = new FormData();
            form.append('vacancy_id', vacId);
            form.append('top_k', topK);
            const resp = await fetch('/search', {method:'POST', body:form});
            const data = await resp.json();
            const container = document.getElementById('results');
            container.innerHTML = '<h2>Результаты</h2>';
            data.candidates.forEach(c => {
                const div = document.createElement('div');
                div.className = 'candidate';
                div.innerHTML = `<strong>${c.id}</strong> (Score: ${c.score.toFixed(3)})<br>
                                 Навыки: ${c.skills.join(', ')}<br>
                                 Комментарий: <pre>${JSON.stringify(c.comment, null, 2)}</pre>`;
                container.appendChild(div);
            });
        }
        loadVacancies();
    </script>
</body>
</html>
