version: '3.8'
services:
  fastapi:
    build: .
    ports:
      - "8080:8080"
    environment:
      - OPENSEARCH_HOST=opensearch
      - LLM_MODE=${LLM_MODE:-api}   # local или api
      - VLLM_API_URL=http://vllm:8000/v1/chat/completions
    volumes:
      - ./data:/app/data
    depends_on:
      - opensearch

  opensearch:
    image: opensearchproject/opensearch:2.13.0
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
    ports:
      - "9200:9200"
    volumes:
      - os-data:/usr/share/opensearch/data

  vllm:
    image: vllm/vllm-openai:latest
    command: --model Qwen/Qwen2.5-7B-Instruct --max-model-len 4096 --api-key not-needed
    ports:
      - "8000:8000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles:
      - gpu

volumes:
  os-data: